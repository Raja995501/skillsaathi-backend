spring:
  flyway:
    enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true
  # ❌ spring.mail NAHI hona chahiye — Resend use ho raha hai

logging:
  level:
    com.skillsaathi: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL:noreply@skillequator.in}
  vapid:
    public:
      key: ${APP_VAPID_PUBLIC_KEY}
    private:
      key: ${APP_VAPID_PRIVATE_KEY}
    subject: ${APP_VAPID_SUBJECT:mailto:skillequator@gmail.com}
