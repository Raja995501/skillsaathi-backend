spring:
  flyway:
    enabled: false  # TiDB ke sath dev/prod me issue se bachne ke liye false rakho (ya agar MySQL migration scripts hain tabhi true karo)
  datasource:
    url: ${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/sys?sslMode=REQUIRE}
    username: ${DB_USERNAME:22dDgebDS2earz5.root}
    password: ${DB_PASSWORD:7w6NDYWE8RQlNxV4}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update   # Tables automatically create/update ho jayengi
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: false  # Agar local ya standard Redis hai toh false rakho

logging:
  level:
    com.skillsaathi: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
